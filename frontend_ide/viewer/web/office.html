<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文書ビューア</title>
  <link rel="stylesheet" href="/office.css">
</head>
<body>
  <header id="toolbar">
    <span id="format-name">文書</span>
    <span class="readonly">読み取り専用</span>
    <span class="spacer"></span>
    <button id="previous" type="button" aria-label="前のページ" hidden>‹</button>
    <span id="page-status" aria-live="polite"></span>
    <button id="next" type="button" aria-label="次のページ" hidden>›</button>
    <label id="zoom-label" hidden>表示
      <select id="zoom" aria-label="表示倍率">
        <option value="fit">幅に合わせる</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
    </label>
  </header>
  <div id="notice" role="status">読み込み中…</div>
  <main id="content"></main>
  <nav id="sheets" aria-label="シート" hidden></nav>
  <script type="module" src="/office.js"></script>
</body>
</html>
