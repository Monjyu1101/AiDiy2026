<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AiDiy Live</title><link rel="icon" type="image/png" href="AiDiy.png"><link rel="stylesheet" href="style.css"><script src="view.js" defer></script></head>
<body>
  <canvas id="audio-cloud" aria-hidden="true"></canvas>
  <header><span id="activity"><span class="activity-dot" aria-hidden="true"></span><span id="status" role="status">未接続</span></span><div class="brand"><strong>AiDiy Live</strong></div><div id="window-controls" hidden><button data-window="minimize" aria-label="最小化">−</button><button data-window="close" aria-label="閉じる">×</button></div></header>
  <div id="activity-bar" aria-hidden="true"></div>
  <main>
    <div class="conversation-toolbar"><div class="conversation-context"><span class="project-label">プロジェクト:</span><span id="project-folder"></span></div><div class="conversation-actions"><button id="new">新しい会話</button><button id="connect" class="primary awaiting">接続</button></div></div>
    <section class="audio-controls" aria-label="音声操作">
      <button id="speaker" class="audio-button" disabled aria-pressed="false" aria-label="スピーカー OFF"><span class="symbol speaker-symbol" aria-hidden="true"></span><strong>OFF</strong></button>
      <button id="mic" class="audio-button" disabled aria-pressed="false" aria-label="マイク OFF"><span class="symbol microphone-symbol" aria-hidden="true"></span><strong>OFF</strong></button>
    </section>
    <section id="transcript" aria-label="会話の記録" role="log" aria-live="polite">
      <div id="empty" class="empty" lang="en">
        <div class="welcome-mark" aria-hidden="true"><img src="AiDiy.png" alt=""></div>
        <p class="terminal-eyebrow"><span class="terminal-type"><span class="terminal-text">LET’S START A CONVERSATION</span></span></p>
        <h1 class="terminal-primary"><span class="terminal-type"><span class="terminal-text">CONNECT, THEN TURN YOUR MIC ON.</span></span></h1>
        <p class="terminal-secondary"><span class="terminal-type"><span class="terminal-text">YOU CAN ALSO TYPE TO CHAT.</span></span></p>
      </div>
    </section>
  </main>
  <footer id="chat-footer">
    <div id="error" role="alert" hidden></div>
    <form id="text-form"><textarea id="text" rows="3" maxlength="20000" placeholder="AiDiyに話しかける…" aria-label="送信するテキスト" title="Enter で改行、Tab で送信ボタンへ移動"></textarea><div class="composer-actions"><span class="keyboard-hint">Enter で改行 <span>·</span> Tab → Enter で送信</span><div class="composer-meta"><div class="model-selection"><button type="button" id="choose-model" aria-label="ライブモデルと音声を選択" aria-haspopup="dialog" aria-controls="model-picker"><span class="model-caption">モデル</span><span class="model-chevron" aria-hidden="true">▾</span></button><span id="model-label">AiDiy のライブ会話</span></div></div><button type="submit" id="send" class="primary" aria-label="送信" title="送信（フォーカス中に Enter）" disabled><img src="sending.png" alt=""></button></div></form>
    <span id="session-label" hidden>音声はマイク ON の間だけ送信します。</span>
  </footer>
  <dialog id="model-picker" aria-labelledby="model-picker-title"><div class="settings-content"><div class="picker-header"><div><h2 id="model-picker-title">ライブモデル・音声</h2><p class="muted">この会話で使用するモデルと音声を選択します。</p></div><button type="button" id="close-model" class="picker-close" aria-label="閉じる">×</button></div><label>ライブ AI <select id="provider" disabled></select></label><label>モデル <select id="model" disabled></select></label><label>音声 <select id="voice" disabled></select></label><p id="model-behavior" class="muted">モデルや音声を変更すると、音声AIへ自動で再接続します。マイクは OFF に戻ります。</p><p id="model-conversation" class="muted">画面の会話は保持し、音声AIの会話を新しく開始します。</p><div id="model-error" role="alert" hidden></div><div class="picker-actions"><button type="button" id="cancel-model">キャンセル</button><button type="button" id="apply" class="primary" disabled>変更して再接続</button></div></div></dialog>
</body></html>
