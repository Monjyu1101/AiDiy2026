<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; img-src {{CSP}}; font-src 'none'; connect-src 'none';">
  <link rel="stylesheet" href="{{STYLE}}">
  <title>AiDiy</title>
</head>
<body>
  <header id="chat-header">
    <div id="title-bar">
      <div class="brand"><img class="brand-icon" src="{{APP_ICON}}" alt=""><div class="brand-name">AiDiy</div></div>
      <nav id="desktop-controls" aria-label="ウィンドウ操作" hidden>
        <button type="button" id="window-minimize" title="最小化" aria-label="最小化"><span class="window-minimize" aria-hidden="true"></span></button>
        <button type="button" id="window-maximize" title="最大化" aria-label="最大化"><span class="window-maximize" aria-hidden="true"></span></button>
        <button type="button" id="window-close" title="閉じる" aria-label="閉じる"><span class="window-close" aria-hidden="true">×</span></button>
      </nav>
    </div>
    <div id="activity-bar" aria-hidden="true"></div>
    <div id="conversation-toolbar">
      <div class="conversation-context"><span id="view-title">今の会話</span><span id="project-folder" title=""></span></div>
      <nav id="header-actions" aria-label="会話操作"><button type="button" id="new-chat" title="新しい会話" disabled>＋ 新規</button><button type="button" id="history-toggle" aria-controls="history-list" aria-expanded="false">一覧</button></nav>
    </div>
  </header>
  <section id="history-list" role="list" aria-label="会話一覧" hidden></section>
  <main id="conversation" aria-label="会話">
    <div id="welcome"><div class="welcome-mark" aria-hidden="true"><img src="{{APP_ICON}}" alt=""></div><p class="welcome-eyebrow"><span class="welcome-type"><span class="welcome-text">LET’S BUILD SOMETHING</span></span></p><h1><span class="welcome-type"><span class="welcome-text">何をつくりますか？</span></span></h1><p class="welcome-caption"><span class="welcome-type"><span class="welcome-text">ここから始まります。</span></span></p></div>
    <div id="messages"></div>
  </main>
  <section id="progress-section" hidden><details id="progress-details"><summary id="progress-title">実行状況</summary><pre id="progress"></pre></details></section>
  <footer id="chat-footer">
    <div id="attachment" hidden><span id="attachment-name"></span><button id="remove-attachment" aria-label="添付を外す">×</button></div>
    <form id="composer"><label class="sr-only" for="prompt">AiDiy へのメッセージ</label><textarea id="prompt" rows="3" maxlength="200000" placeholder="AiDiyに依頼する..." title="Enter で改行、Tab で送信ボタンへ移動"></textarea><div class="composer-actions"><span class="keyboard-hint">Enter で改行 <span>·</span> Tab → Enter で送信</span><div class="composer-meta"><span id="activity" role="status"><span class="activity-dot" aria-hidden="true"></span><span id="activity-label">接続中</span></span><div class="model-selection"><button type="button" id="choose-model" aria-label="プロバイダとモデルを選択" aria-haspopup="dialog" aria-controls="model-picker"><span class="model-caption">モデル</span><span class="model-chevron" aria-hidden="true">▾</span></button><span id="model-label"></span></div></div><button type="button" id="stop" aria-label="実行を停止" hidden><img class="stop-icon" src="{{STOP_ICON}}" alt=""><span class="stop-label" aria-hidden="true">STOP</span></button><button type="submit" id="send" class="primary" aria-label="送信" title="送信（フォーカス中に Enter）"><img src="{{SEND_ICON}}" alt=""></button></div></form>
    <div id="status" role="status" hidden></div>
  </footer>
  <dialog id="model-picker" aria-labelledby="model-picker-title">
    <form method="dialog" id="model-picker-form">
      <div class="picker-header"><div><h2 id="model-picker-title">使用するAIモデル</h2><p>このチャットの次回送信から使用します。</p></div><button type="submit" value="cancel" class="picker-close" aria-label="閉じる">×</button></div>
      <label for="provider-select">プロバイダ</label>
      <select id="provider-select"></select>
      <label for="model-select">モデル</label>
      <select id="model-select"></select>
      <label for="custom-model" id="custom-model-label" hidden>モデル ID</label>
      <input id="custom-model" maxlength="300" autocomplete="off" spellcheck="false" hidden>
      <p id="model-picker-status" class="picker-status" role="status" aria-live="polite"></p>
      <div class="picker-actions"><button type="submit" value="cancel">キャンセル</button><button id="apply-model" type="button" class="primary">このモデルを使用</button></div>
    </form>
  </dialog>
  <dialog id="delete-history-dialog" aria-labelledby="delete-history-title" aria-describedby="delete-history-message">
    <form method="dialog" class="delete-history-form">
      <h2 id="delete-history-title">会話を削除</h2>
      <p id="delete-history-message">この会話を削除しますか？</p>
      <p id="delete-history-name"></p>
      <div class="picker-actions"><button type="submit" value="cancel">キャンセル</button><button id="confirm-delete-history" type="button" class="danger">削除</button></div>
    </form>
  </dialog>
  <script nonce="{{NONCE}}" src="{{SCRIPT}}"></script>
</body>
</html>
