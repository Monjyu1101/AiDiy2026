<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; img-src {{CSP}}; font-src 'none'; connect-src 'none';">
  <link rel="stylesheet" href="{{STYLE}}">
  <title>AiDiy</title>
</head>
<body>
  <header id="chat-header"><div class="header-title"><strong id="view-title">今の会話</strong><span id="project-folder" title=""></span></div><nav id="header-actions"><div id="standalone-actions"><button type="button" id="standalone-new" title="新しい会話">＋ 新規</button></div><button type="button" id="history-toggle" aria-controls="history-list" aria-expanded="false">一覧</button></nav></header>
  <section id="history-list" role="list" aria-label="会話一覧" hidden></section>
  <main id="conversation" aria-label="会話">
    <div id="messages"></div>
  </main>
  <section id="progress-section" hidden><details id="progress-details"><summary id="progress-title">実行状況</summary><pre id="progress"></pre></details></section>
  <footer id="chat-footer">
    <div id="attachment" hidden><span id="attachment-name"></span><button id="remove-attachment" aria-label="添付を外す">×</button></div>
    <form id="composer"><label class="sr-only" for="prompt">AiDiy へのメッセージ</label><textarea id="prompt" rows="3" maxlength="200000" placeholder="AiDiyに依頼する..." title="Enter で送信、Shift+Enter で改行"></textarea><div class="composer-actions"><button type="button" id="choose-model" aria-label="プロバイダとモデルを選択" aria-haspopup="dialog" aria-controls="model-picker"><span class="model-caption">モデル</span><span id="model-label">自動 / CLI の設定</span><span class="model-chevron" aria-hidden="true">▾</span></button><button type="button" id="stop" aria-label="実行を停止" hidden><span class="stop-icon" aria-hidden="true"><img src="{{STOP_ICON}}" alt=""></span><span class="stop-label" aria-hidden="true">STOP</span></button><button type="submit" id="send" class="primary" aria-label="送信" title="送信"><img src="{{SEND_ICON}}" alt=""></button></div></form>
    <div id="status" role="status" hidden></div>
  </footer>
  <dialog id="model-picker" aria-labelledby="model-picker-title">
    <form method="dialog" id="model-picker-form">
      <div class="picker-header"><div><h2 id="model-picker-title">使用するAIモデル</h2><p>このチャットの次回送信から使用します。</p></div><button type="submit" value="cancel" class="picker-close" aria-label="閉じる">×</button></div>
      <label for="provider-select">プロバイダ</label>
      <select id="provider-select"></select>
      <label for="model-select">モデル</label>
      <select id="model-select"></select>
      <label for="custom-model" id="custom-model-label" hidden>モデル ID</label>
      <input id="custom-model" maxlength="300" autocomplete="off" spellcheck="false" hidden>
      <p id="model-picker-status" class="picker-status" role="status" aria-live="polite"></p>
      <div class="picker-actions"><button type="submit" value="cancel">キャンセル</button><button id="apply-model" type="button" class="primary">このモデルを使用</button></div>
    </form>
  </dialog>
  <script nonce="{{NONCE}}" src="{{SCRIPT}}"></script>
</body>
</html>
