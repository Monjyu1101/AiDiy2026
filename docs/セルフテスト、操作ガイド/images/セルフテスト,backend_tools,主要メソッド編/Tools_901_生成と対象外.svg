<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="生成メソッドの結果と環境条件"><title>生成メソッドの結果と環境条件</title><desc>画像は実生成を確認。実行できない機能は成功と混ぜず、理由を明記します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18858b"/></marker></defs><rect width="960" height="380" rx="18" fill="#f1f6f8"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#18344a"><text x="28" y="45" font-size="26" font-weight="bold">生成メソッドの結果と環境条件</text><text x="28" y="77" font-size="16">画像は実生成を確認。実行できない機能は成功と混ぜず、理由を明記します。</text><rect x="28" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="28" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="44" y="133" font-size="19" fill="white" font-weight="bold">画像：OK</text><text x="44" y="178" font-size="17">generate_image / prompt</text><text x="44" y="207" font-size="17">provider：openai</text><text x="44" y="236" font-size="17">quality：low</text><text x="44" y="265" font-size="17">save_path：PNGの絶対パス</text><path d="M 311 213 H 335" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="338" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="354" y="133" font-size="19" fill="white" font-weight="bold">動画：PASS・対象外</text><text x="354" y="178" font-size="17">generate_movie</text><text x="354" y="207" font-size="17">指定Veoモデルは提供終了</text><text x="354" y="236" font-size="17">外部API：404 NOT_FOUND</text><text x="354" y="265" font-size="17">動画生成の成功は未確認</text><path d="M 621 213 H 645" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="648" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="664" y="133" font-size="19" fill="white" font-weight="bold">PostgreSQL：PASS・対象外</text><text x="664" y="178" font-size="17">postgres_server_info</text><text x="664" y="207" font-size="17">dsn：接続先が未設定</text><text x="664" y="236" font-size="17">外部DBへ接続できない</text><text x="664" y="265" font-size="17">DB参照の成功は未確認</text><text x="28" y="347" font-size="16" fill="#34616a">PASSは環境依存・判定対象外です。成功した機能数には含めません。</text></g></svg>