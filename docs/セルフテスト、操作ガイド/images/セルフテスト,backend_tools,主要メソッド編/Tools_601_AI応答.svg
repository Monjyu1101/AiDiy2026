<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="AIの種類と返される結果"><title>AIの種類と返される結果</title><desc>同じ「実行」でも、チャット・コード・判断で入力と結果が異なります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18858b"/></marker></defs><rect width="960" height="380" rx="18" fill="#f1f6f8"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#18344a"><text x="28" y="45" font-size="26" font-weight="bold">AIの種類と返される結果</text><text x="28" y="77" font-size="16">同じ「実行」でも、チャット・コード・判断で入力と結果が異なります。</text><rect x="28" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="28" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="44" y="133" font-size="19" fill="white" font-weight="bold">チャット</text><text x="44" y="178" font-size="17">prompt：2 + 3 の計算</text><text x="44" y="207" font-size="17">ai_name：gemini_chat</text><text x="44" y="236" font-size="17">use_tools：false</text><text x="44" y="265" font-size="17">結果：5</text><path d="M 311 213 H 335" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="338" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="354" y="133" font-size="19" fill="white" font-weight="bold">コード</text><text x="354" y="178" font-size="17">prompt：確認.txtを読む</text><text x="354" y="207" font-size="17">ai_name：codex_cli</text><text x="354" y="236" font-size="17">project_path：専用フォルダ</text><text x="354" y="265" font-size="17">結果：青い鳥</text><path d="M 621 213 H 645" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="648" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="664" y="133" font-size="19" fill="white" font-weight="bold">判断</text><text x="664" y="178" font-size="17">input：鳥についての文章</text><text x="664" y="207" font-size="17">questions：predicate</text><text x="664" y="236" font-size="17">model：OpenAI OAuth</text><text x="664" y="265" font-size="17">結果：probability = 1.0</text><text x="28" y="347" font-size="16" fill="#34616a">注意：Chat/Codeは履歴保存も確認。AI判断の確率はモデルの推定値です。</text></g></svg>