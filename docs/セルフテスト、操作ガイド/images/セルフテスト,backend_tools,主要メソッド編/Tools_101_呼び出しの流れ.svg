<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Toolsの呼び出し方"><title>Toolsの呼び出し方</title><desc>MCP名・メソッド・入力JSONを指定し、応答の中身で成功を判断します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18858b"/></marker></defs><rect width="960" height="380" rx="18" fill="#f1f6f8"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#18344a"><text x="28" y="45" font-size="26" font-weight="bold">Toolsの呼び出し方</text><text x="28" y="77" font-size="16">MCP名・メソッド・入力JSONを指定し、応答の中身で成功を判断します。</text><rect x="28" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="28" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="44" y="133" font-size="19" fill="white" font-weight="bold">1 入力を用意</text><text x="44" y="178" font-size="17">MCP名：aidiy_sqlite</text><text x="44" y="207" font-size="17">SQL：SELECT 42 AS 確認値</text><text x="44" y="236" font-size="17">allow_write：false</text><path d="M 311 213 H 335" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="338" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="354" y="133" font-size="19" fill="white" font-weight="bold">2 主要メソッドを実行</text><text x="354" y="178" font-size="17">MCP：sqlite_query</text><text x="354" y="207" font-size="17">REST：/aidiy_sqlite/query</text><text x="354" y="236" font-size="17">接続先：127.0.0.1:8095</text><path d="M 621 213 H 645" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="648" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="664" y="133" font-size="19" fill="white" font-weight="bold">3 結果を照合</text><text x="664" y="178" font-size="17">rows の確認値：42</text><text x="664" y="207" font-size="17">HTTP 200だけでは判定しない</text><text x="664" y="236" font-size="17">error・status・生成物も確認</text><text x="28" y="347" font-size="16" fill="#34616a">確認済み：REST と MCP Streamable HTTP。SSE・stdio の全経路比較は今回の対象外です。</text></g></svg>