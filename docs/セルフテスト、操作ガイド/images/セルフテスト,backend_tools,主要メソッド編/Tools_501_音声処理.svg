<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="文章から音声を作り、文字へ戻す"><title>文章から音声を作り、文字へ戻す</title><desc>音声合成・形式変換・認識をつないで主要メソッドを確認しました。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18858b"/></marker></defs><rect width="960" height="380" rx="18" fill="#f1f6f8"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#18344a"><text x="28" y="45" font-size="26" font-weight="bold">文章から音声を作り、文字へ戻す</text><text x="28" y="77" font-size="16">音声合成・形式変換・認識をつないで主要メソッドを確認しました。</text><rect x="28" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="28" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="44" y="133" font-size="19" fill="white" font-weight="bold">1 音声合成</text><text x="44" y="178" font-size="17">speech_text：読み上げ文</text><text x="44" y="207" font-size="17">provider：auto → Edge</text><text x="44" y="236" font-size="17">local_play：true</text><text x="44" y="265" font-size="17">結果：MP3ファイル</text><path d="M 311 213 H 335" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="338" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="354" y="133" font-size="19" fill="white" font-weight="bold">2 音声形式の変換</text><text x="354" y="178" font-size="17">ffmpeg_run / args_str</text><text x="354" y="207" font-size="17">-ar 16000：16kHz</text><text x="354" y="236" font-size="17">-ac 1：モノラル</text><text x="354" y="265" font-size="17">結果：WAV・4.392秒</text><path d="M 621 213 H 645" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="648" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="664" y="133" font-size="19" fill="white" font-weight="bold">3 音声認識</text><text x="664" y="178" font-size="17">recognize_speech</text><text x="664" y="207" font-size="17">file_path：WAVの絶対パス</text><text x="664" y="236" font-size="17">provider：openai</text><text x="664" y="265" font-size="17">結果：recognition_text</text><text x="28" y="347" font-size="16" fill="#34616a">注意：認識文は原文と照合します。空白を含むパスは引用符で囲み、MP3の再生と認識を分けて確認します。</text></g></svg>