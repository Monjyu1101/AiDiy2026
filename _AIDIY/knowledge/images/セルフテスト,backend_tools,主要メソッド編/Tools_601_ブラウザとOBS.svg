<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="実画面を対象にするメソッド"><title>実画面を対象にするメソッド</title><desc>表示用のChromeとOBSを起動し、操作・状態取得・終了まで確認しました。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18858b"/></marker></defs><rect width="960" height="380" rx="18" fill="#f1f6f8"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#18344a"><text x="28" y="45" font-size="26" font-weight="bold">実画面を対象にするメソッド</text><text x="28" y="77" font-size="16">表示用のChromeとOBSを起動し、操作・状態取得・終了まで確認しました。</text><rect x="28" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="28" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="44" y="133" font-size="19" fill="white" font-weight="bold">ブラウザ</text><text x="44" y="178" font-size="17">session：tools-selftest</text><text x="44" y="207" font-size="17">navigate → type_text → click</text><text x="44" y="236" font-size="17">get_text：確認成功を照合</text><text x="44" y="265" font-size="17">screenshot → close_session</text><path d="M 311 213 H 335" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="338" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="354" y="133" font-size="19" fill="white" font-weight="bold">デスクトップ</text><text x="354" y="178" font-size="17">window_title：対象窓の名前</text><text x="354" y="207" font-size="17">screenshot：PNG保存</text><text x="354" y="236" font-size="17">Windows：list_windows</text><text x="354" y="265" font-size="17">screen_info：モニター取得</text><path d="M 621 213 H 645" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="648" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="664" y="133" font-size="19" fill="white" font-weight="bold">OBS</text><text x="664" y="178" font-size="17">先にOBS Studioを起動</text><text x="664" y="207" font-size="17">obs_status：接続・状態取得</text><text x="664" y="236" font-size="17">obs_list_scenes：シーン一覧</text><text x="664" y="265" font-size="17">確認後はOBSを終了</text><text x="28" y="347" font-size="16" fill="#34616a">注意：専用Chromeは表示あり。OBSの配信・録画開始や既存シーンの変更は今回の対象外です。</text></g></svg>