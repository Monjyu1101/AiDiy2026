<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Task / Team は「受付」と「完了」を分ける"><title>Task / Team は「受付」と「完了」を分ける</title><desc>今回の主要メソッド試験は、投入・状態取得・実行OFFの保持を確認します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18858b"/></marker></defs><rect width="960" height="380" rx="18" fill="#f1f6f8"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#18344a"><text x="28" y="45" font-size="26" font-weight="bold">Task / Team は「受付」と「完了」を分ける</text><text x="28" y="77" font-size="16">今回の主要メソッド試験は、投入・状態取得・実行OFFの保持を確認します。</text><rect x="28" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="28" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="44" y="133" font-size="19" fill="white" font-weight="bold">1 依頼を登録</text><text x="44" y="178" font-size="17">submit / prompt</text><text x="44" y="207" font-size="17">project_path：専用フォルダ</text><text x="44" y="236" font-size="17">enabled：false</text><text x="44" y="265" font-size="16">Task：user_id / Team：member_id</text><path d="M 311 213 H 335" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="338" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="354" y="133" font-size="19" fill="white" font-weight="bold">2 IDを受け取る</text><text x="354" y="178" font-size="17">Task：TK00001009</text><text x="354" y="207" font-size="17">Team：TR00001007</text><text x="354" y="236" font-size="17">受付成功は実行完了ではない</text><text x="354" y="265" font-size="17">準備処理は実行OFFでも進む</text><path d="M 621 213 H 645" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="648" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="664" y="133" font-size="19" fill="white" font-weight="bold">3 状態を確認</text><text x="664" y="178" font-size="17">get_request_status</text><text x="664" y="207" font-size="17">get_detail_status</text><text x="664" y="236" font-size="17">get_work_status</text><text x="664" y="265" font-size="17">準備完了・実行OFF・PID空欄</text><text x="28" y="347" font-size="16" fill="#34616a">注意：業務実行までの完了試験はAIタスク編・AIチーム編を参照。今回の登録は自動実行OFFを維持します。</text></g></svg>