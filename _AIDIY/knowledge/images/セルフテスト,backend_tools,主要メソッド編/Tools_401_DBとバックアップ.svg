<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="DB参照・構文確認・バックアップ"><title>DB参照・構文確認・バックアップ</title><desc>参照する対象と、ファイルを書き込む対象を分けて指定します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18858b"/></marker></defs><rect width="960" height="380" rx="18" fill="#f1f6f8"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#18344a"><text x="28" y="45" font-size="26" font-weight="bold">DB参照・構文確認・バックアップ</text><text x="28" y="77" font-size="16">参照する対象と、ファイルを書き込む対象を分けて指定します。</text><rect x="28" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="28" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="44" y="133" font-size="19" fill="white" font-weight="bold">パラメータ</text><text x="44" y="178" font-size="17">sql / params：検索条件</text><text x="44" y="207" font-size="17">file_path：Pythonファイル</text><text x="44" y="236" font-size="17">project_root：専用フォルダ</text><path d="M 311 213 H 335" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="338" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="354" y="133" font-size="19" fill="white" font-weight="bold">主要メソッド</text><text x="354" y="178" font-size="17">sqlite_query：SELECT</text><text x="354" y="207" font-size="17">check_python_syntax：構文</text><text x="354" y="236" font-size="17">backup_run：専用試験の保存</text><path d="M 621 213 H 645" stroke="#18858b" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="105" width="280" height="203" rx="12" fill="white" stroke="#bfd3da"/><rect x="648" y="105" width="280" height="42" rx="12" fill="#183e56"/><text x="664" y="133" font-size="19" fill="white" font-weight="bold">成功の目印</text><text x="664" y="178" font-size="17">rows：指定した値が一致</text><text x="664" y="207" font-size="17">returncode：0</text><text x="664" y="236" font-size="17">保存後の scan：差分0件</text><text x="28" y="347" font-size="16" fill="#34616a">注意：SQLiteは allow_write=false。バックアップ試験は専用フォルダだけを指定します。</text></g></svg>